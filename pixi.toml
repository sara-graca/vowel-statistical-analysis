[workspace]
authors = ["sara-graca <saravsgraca@gmail.com>"]
channels = ["conda-forge"]
name = "statistical-vowel-analysis"
platforms = ["win-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26,<2"
pandas = ">=2.2,<3"
matplotlib = ">=3.8,<3.10"
ipykernel = ">=7.3.0,<8"
pyzmq = ">=25,<26"
scipy = ">=1.17.1,<2"
statsmodels = ">=0.15.0,<0.16"
jupyter = ">=1.1.1,<2"
nbconvert = ">=7.17.1,<8"
mlxtend = ">=0.25.0,<0.26"

[activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"
